services:
  backend:
    build:
      context: ../..
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      IMAGE_STORAGE: mongodb
      TRUST_PROXY_HOPS: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
volumes:
  caddy_data:
  caddy_config:
